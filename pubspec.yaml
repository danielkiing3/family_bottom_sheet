name: family_bottom_sheet
description: Multi-page modal sheets and dialogs that keep each page's state and resize smoothly between pages. Fully custom look, adaptive for tablets.
version: 1.0.0-dev.1
repository: https://github.com/danielkiing3/family_bottom_sheet
issue_tracker: https://github.com/danielkiing3/family_bottom_sheet/issues

topics:
  - ui
  - widget
  - bottom-sheet
  - custom-modal

screenshots:
  - description: 'Pages keep their state while you move between them'
    path: doc/screenshots/state-iphone.webp
  - description: 'A flow that pushes, replaces and starts over in one sheet'
    path: doc/screenshots/flow-iphone.webp
  - description: 'A floating sheet on iPad'
    path: doc/screenshots/floating-ipad.webp

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  scroll_drag_detector: ^0.1.0+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
